<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App with Export</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #addBtn { background-color: #007bff; color: white; }
        #addBtn:hover { background-color: #0056b3; }

        /* The Download Button Style */
        #downloadBtn {
            background-color: #6c757d;
            color: white;
            width: 100%;
            margin-top: 15px;
        }
        #downloadBtn:hover { background-color: #5a6268; }

        ul { list-style: none; padding: 0; }

        li {
            background: #fafafa;
            border: 1px solid #eee;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }

        .delete-btn { background: #ff4757; color: white; padding: 5px 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>My Tasks</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a task...">
            <button id="addBtn" onclick="addTask()">Add</button>
        </div>
        
        <ul id="taskList"></ul>

        <button id="downloadBtn" onclick="downloadList()">Download as .txt</button>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        window.onload = getTasks;

        function addTask() {
            const val = taskInput.value.trim();
            if (!val) return;
            createTaskElement(val);
            saveLocalTask(val);
            taskInput.value = '';
        }

        function createTaskElement(task) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${task}</span><button class="delete-btn">Delete</button>`;
            li.querySelector('.delete-btn').onclick = () => {
                li.remove();
                removeLocalTask(task);
            };
            taskList.appendChild(li);
        }

        // --- NEW: Download Logic ---
        function downloadList() {
            // 1. Get the current tasks from LocalStorage
            const tasks = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
            
            if (tasks.length === 0) {
                alert("The list is empty!");
                return;
            }

            // 2. Format the list: Add a header and a bullet point for each task
            const date = new Date().toLocaleDateString();
            let fileContent = `TO-DO LIST (${date})\n`;
            fileContent += "====================\n\n";
            
            tasks.forEach((task, index) => {
                fileContent += `${index + 1}. [ ] ${task}\n`;
            });

            // 3. Create a Blob with the text content
            const blob = new Blob([fileContent], { type: 'text/plain' });
            
            // 4. Create a temporary link and trigger the download
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'my-todo-list.txt';
            
            // 5. Trigger the click and clean up
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // Standard LocalStorage functions
        function saveLocalTask(t) {
            let ts = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
            ts.push(t);
            localStorage.setItem('tasks', JSON.stringify(ts));
        }

        function getTasks() {
            let ts = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
            ts.forEach(t => createTaskElement(t));
        }

        function removeLocalTask(t) {
            let ts = JSON.parse(localStorage.getItem('tasks'));
            ts.splice(ts.indexOf(t), 1);
            localStorage.setItem('tasks', JSON.stringify(ts));
        }
    </script>
</body>
</html>
