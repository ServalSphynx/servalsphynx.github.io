<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico"
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="andoird-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
  <link rel="apple-touch-icon" type="image/png" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    background-color: #eef2f3;
  }

  .dark-mode {
    background-color: #313338;
    color: white;
  }

  .navbar {
    overflow: hidden;
    background-color: #333; 
  }

  .navbar a {
    float: left;
    font-size: 16px;
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
  }

  .subnav {
    float: left;
    overflow: hidden;
  }

  .subnav .subnavbtn {
    font-size: 16px;  
    border: none;
    outline: none;
    color: white;
    padding: 14px 16px;
    background-color: inherit;
    font-family: inherit;
    margin: 0;
  }

  .navbar a:hover, .subnav:hover .subnavbtn {
    background-color: red;
  }

  .subnav-content {
    display: none;
    position: absolute;
    left: 0;
    background-color: red;
    width: 100%;
    z-index: 1;
  }

  .subnav-content a {
    float: left;
    color: white;
    text-decoration: none;
  }

  .subnav-content a:hover {
    background-color: #eee;
    color: black;
  }

  .subnav:hover .subnav-content {
    display: block;
  }

  .container { 
    color: black;
    background: #fff;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0,1);
    display: grid;
    justify-content: center;
    align-items: center;
    width: 100%
    max-width: 400px;
  }

  .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 6px; }
        
  button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  #addBtn { background-color: #007bff; color: white; }

  ul { list-style: none; padding: 0; margin-top: 20px; }
  li { background: #fafafa; border: 1px solid #eee; margin-bottom: 8px; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .delete-btn { background: #ff4757; color: white; padding: 5px 10px; font-size: 12px; }

  h1 { text-align: center;}

  .actions { display: flex; gap: 10px; margin-top: 20px; flex-direction: column; }
  .btn-secondary { background-color: #6c757d; color: white; width: 100%; }

  #fileInput { display: none; }

  </style>
  
</head>
<body>
  
  <div class="navbar">
    <a class="active" href="https://servalsphynx.github.io"><i class="fa fa-home" aria-hidden="true" style="font-size:24px; color: white;"></i></a>
    <div class="nav pull-right">
      <button type="button" onclick="toggleDark()">
        <span class="glyphicon glyphicon-plus"></span>
        <i class="fa fa-moon-o" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="container">
    <h1>To Do List</h1>
    <div class="input group">
      <input type="text" id="taskIn" placeholder="Add a task...">
      <button id="addBtn" onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    const taskIn = document.getElementById('taskIn');
    const taskList = document.getElementById('taskList');

    window.onload = getTasks;
    window.onload = checkDark;
    
    function addTask() {
      const val = taskIn.value.trim();
      if(!val) return;
      createTaskElement(val);
      saveLocalTask(val);
      taskIn.val = '';
    }

    function createTaskElement(task) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${task}</span><button class="delete-btn">Delete</button>`;
      li.querySelector('.delete-btn').onclick = () => {
        li.remove();
        removeLocalTask(task);
      };
      taskList.appendChild(li);
    }

    function saveLocalTask(t) {
      let ts = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
      ts.push(t);
      localStorage.setItem('tasks', JSON.stringify(ts));
    }

    function getTasks() {
      let ts = localStorage.getItem('tasks') ? JSON.parse(localStorage.getItem('tasks')) : [];
      ts.forEach(t => createTaskElement(t));
    }

    function toggleDark() {
      const element = document.body;
      element.classList.toggle("dark-mode");
      if (element.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
      }
      else {
        localStorage.setItem("theme", "light");
      }
    }

    function checkDark() {
      if (localStorage.getItem("theme") == "dark") {
        toggleDark();
      }
      else if (localStorage.getItem("theme") == "light") {
        return false;
      }
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
	toggleDark();
      }

    }
	  
  </script>

</body>
</html>
